<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1c1f32;
      padding-bottom: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #00f2fe 0%, #a100ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #090a0f;
      font-size: 13px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }
    .stat-card {
      background: #121420;
      border: 1px solid #1c1f32;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: #00f2fe;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #090a0f;
      text-align: center;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body>

    <div class="logo">A</div>
    <div class="title">ApplySense AI</div>
  </div>
