version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: applysense_db
    environment:
      POSTGRES_DB: applysense
      POSTGRES_USER: applysense_user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: applysense_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: applysense_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_ENGINE=postgres
      - POSTGRES_DB=applysense
      - POSTGRES_USER=applysense_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: applysense_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
